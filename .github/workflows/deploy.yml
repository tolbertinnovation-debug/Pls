name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; queue at most one more behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static export
        env:
          # Drives the canonical origin, the /Pls base path, sitemap and
          # robots. Change it here (and in Pages settings) if a custom domain
          # is added later.
          NEXT_PUBLIC_SITE_URL: https://tolbertinnovation-debug.github.io/Pls
          # Optional: a form endpoint the browser can POST to. Without it the
          # quote form hands the visitor a prefilled email instead.
          NEXT_PUBLIC_QUOTE_ENDPOINT: ${{ vars.NEXT_PUBLIC_QUOTE_ENDPOINT }}
        run: npm run build

      - name: Report Pages configuration
        # Deploying to Pages needs Source = "GitHub Actions" AND a branch the
        # github-pages environment allows. Print both so a failed deploy says
        # which one is wrong instead of failing with no output.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "workflow ref   : ${{ github.ref_name }}"
          echo "default branch : $(gh api repos/${{ github.repository }} --jq .default_branch 2>&1)"
          echo "pages config   : $(gh api repos/${{ github.repository }}/pages --jq '{build_type,html_url}' 2>&1)"
          echo "(build_type must be \"workflow\"; \"legacy\" means Source is still Deploy from a branch)"

      - name: Bypass Jekyll
        # Without this, GitHub Pages would strip the _next/ directory.
        run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
